<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noxe</title>
<meta name="description" content="Noxe: your taste, one place. Games, films, music, books and manga in one library.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Noxe">
<meta property="og:title" content="Noxe">
<meta property="og:description" content="Your taste, one place. Games, films, music, books and manga in one library.">
<meta property="og:image" content="https://noxeteam.com/og-icon.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Noxe">
<meta name="twitter:description" content="Your taste, one place. Games, films, music, books and manga in one library.">
<meta name="twitter:image" content="https://noxeteam.com/og-icon.png">
<meta name="theme-color" content="#070611">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070611'/%3E%3Cpath d='M18 46V18l28 28V18' fill='none' stroke='%23A05BFF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#070611; --card:#0c0a1a; --sheet:#070510; --ink:#f3f1fa; --muted:#b9b4cc; --dim:rgba(255,255,255,0.5);
    --accent:#A05BFF; --line:rgba(255,255,255,0.08); --s1:rgba(255,255,255,0.045); --s2:rgba(255,255,255,0.075);
    --game:#4EA8FF; --movie:#FB4D5D; --music:#1DB954; --book:#FBBF24; --manga:#D98A8A;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  main.wrap{max-width:480px;margin:0 auto;padding:32px 20px 48px;min-height:100%;display:flex;flex-direction:column;align-items:center}
  a{text-decoration:none}
  .brand{align-self:center;margin-bottom:8px}
  .mark{font-size:34px;font-weight:800;letter-spacing:-1.5px;color:#fff;margin:0}
  .mark span{color:var(--accent)}
  .card{width:100%;max-width:400px;text-align:center;margin-top:12px}
  .who{margin:22px 0 0;font-size:22px;font-weight:700;letter-spacing:-.3px}
  .handle-line{margin:2px 0 0;font-size:14px;color:var(--muted);font-weight:600}
  .what{margin:8px 0 0;font-size:15px;color:var(--muted);line-height:1.5}
  .privnote{margin:14px 0 0;font-size:13px;color:var(--dim);font-style:italic}
  .btn{display:block;margin:28px auto 0;padding:15px 20px;border-radius:999px;font-weight:800;font-size:16px;text-decoration:none;color:#fff;background:var(--accent);text-align:center}
  .btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:12px}
  .hidden{display:none}
  .avatar-shell{width:72px;height:72px;border-radius:50%;margin:0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0c0a18}
  .avatar-shell img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar-shell svg{width:100%;height:100%;display:block}

  /* ── full public profile ─────────────────────────────────────────── */
  .profile{width:100%}
  .pf-head{text-align:center}
  .pf-avatar{width:88px;height:88px;border-radius:50%;margin:0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0c0a18;border:2px solid var(--line)}
  .pf-avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .pf-avatar svg{width:100%;height:100%;display:block}
  .pf-name{margin:16px 0 0;font-size:22px;font-weight:800;letter-spacing:-.3px}
  .pf-handle{margin:2px 0 0;font-size:14px;color:var(--muted);font-weight:600}
  .pf-bio{margin:10px 0 0;font-size:14px;color:var(--muted);line-height:1.5;padding:0 8px}
  .pf-actions{display:flex;flex-direction:row;gap:10px;justify-content:center;margin-top:20px}
  .pf-actions .btn{margin-top:0;flex:1;max-width:180px;padding:13px 16px;font-size:14px}

  .sec-title{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:34px 0 0;text-align:center}

  .orbit-wrap{margin-top:6px}
  .orbit{position:relative;width:min(88vw,340px);height:min(78vw,300px);margin:18px auto 0;animation:orbit-spin 150s linear infinite}
  @media (prefers-reduced-motion:reduce){.orbit{animation:none}}
  .orbit-item{position:absolute;transform:translate(-50%,-50%)}

  .cover{position:relative;border-radius:10px;overflow:hidden;background:#0c0a18;border:1px solid var(--line);display:flex;align-items:flex-end;flex-direction:row}
  .cover img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .cover-title{position:relative;display:block;width:100%;padding:5px 5px 6px;font-size:9px;line-height:1.15;font-weight:700;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,0.55));text-shadow:0 1px 2px rgba(0,0,0,0.6)}

  .top3-wrap{width:100%}
  .top3{display:flex;flex-direction:row;gap:12px;justify-content:center;margin-top:16px}
  .top3 .cover{width:92px;height:134px;flex:0 0 auto}
  .top3 .cover-title{font-size:11px}

  .cats-wrap{width:100%}
  .chips{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .chip{font-size:13px;font-weight:700;color:var(--ink);background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:8px 14px}

  .foot{margin-top:40px;font-size:12px;color:var(--muted);text-align:center}
  .foot a{color:var(--muted)}

  @keyframes orbit-spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="wrap">
  <a class="brand" href="/"><p class="mark">N<span>o</span>xe</p></a>

  <section class="card" id="card">
    <div class="avatar-shell hidden" id="avatar"></div>
    <p class="who" id="who">Your taste, one place.</p>
    <p class="handle-line hidden" id="handleLine"></p>
    <p class="what" id="what">Games, films, music, books and manga in one library, on your profile.</p>
    <p class="privnote hidden" id="privnote">This library is private.</p>
    <a class="btn hidden" id="open" href="#">Open in Noxe</a>
    <a class="btn" id="store" href="https://apps.apple.com/app/id6791178488">Get Noxe on the App Store</a>
  </section>

  <section class="profile hidden" id="profileFull">
    <div class="pf-head">
      <div class="pf-avatar" id="pfAvatar"></div>
      <p class="pf-name" id="pfName"></p>
      <p class="pf-handle" id="pfHandle"></p>
      <p class="pf-bio" id="pfBio"></p>
      <div class="pf-actions">
        <a class="btn" id="pfOpen" href="#">Open in Noxe</a>
        <a class="btn alt" id="pfStore" href="https://apps.apple.com/app/id6791178488">Get Noxe</a>
      </div>
    </div>

    <div class="orbit-wrap hidden" id="orbitWrap">
      <p class="sec-title">Library</p>
      <div class="orbit" id="orbit"></div>
    </div>

    <div class="top3-wrap hidden" id="top3Wrap">
      <p class="sec-title">Top 3</p>
      <div class="top3" id="top3"></div>
    </div>

    <div class="cats-wrap hidden" id="catsWrap">
      <p class="sec-title">Collections</p>
      <div class="chips" id="chips"></div>
    </div>
  </section>

  <p class="foot"><a href="https://legal.noxeteam.com/#privacy">Privacy</a> &middot; <a href="https://legal.noxeteam.com/#terms">Terms</a> &middot; <a href="mailto:help@noxeteam.com">help@noxeteam.com</a></p>
</main>
<script>
(function () {
  // Public, static, no build step. Reads ONLY public.profiles (world readable) and public.media_cache
  // (world readable, immutable) via the Supabase REST endpoint. Never touches library/episode_watches.
  var SUPABASE_URL = "https://hobuksmoxjiskjnnjtxp.supabase.co";
  var SUPABASE_ANON = "sb_publishable_nRpnr3Dy-bjdYXlYzAz_yw_4xXjwf-2";
  var TYPE_COLOR = { game: "#4EA8FF", movie: "#FB4D5D", music: "#1DB954", book: "#FBBF24", manga: "#D98A8A" };
  var STORE_URL = "https://apps.apple.com/app/id6791178488";
  var RING_MAX = 24; // bounded read: never fetch/render an unbounded library on a public page

  var parts = location.pathname.split("/").filter(Boolean);
  var card = document.getElementById("card");
  var whoEl = document.getElementById("who");
  var whatEl = document.getElementById("what");
  var openBtn = document.getElementById("open");
  var storeBtn = document.getElementById("store");

  if (!parts.length) return; // root: keep the plain landing markup above, untouched

  function showOpen(scheme) {
    openBtn.href = scheme;
    openBtn.classList.remove("hidden");
    storeBtn.classList.add("alt");
  }

  // Reserved path: an artwork share link (noxeteam.com/a/<id>). Unchanged from before.
  if (parts[0] === "a" && parts[1]) {
    whoEl.textContent = "An artwork on Noxe";
    whatEl.textContent = "Open it in the app to see the rating, the notes and who else loves it.";
    showOpen("noxe://a/" + encodeURIComponent(parts[1]));
    return;
  }

  var raw = decodeURIComponent(parts[0]).replace(/^@/, "");
  if (!/^[A-Za-z0-9._]{2,30}$/.test(raw)) return; // not a valid handle shape: fall back to the generic card

  document.title = "@" + raw + " on Noxe";
  whoEl.textContent = "Looking for @" + raw + "…";
  whatEl.textContent = "";

  function esc(v) { return String(v).replace(/([%_\\])/g, "\\$1"); } // ilike wildcard escape

  var qs = "select=handle,name,bio,avatar,accent,lib,top3,cats,ratings,priv"
    + "&handle=ilike." + encodeURIComponent(esc(raw)) + "&limit=1";

  fetch(SUPABASE_URL + "/rest/v1/profiles?" + qs, { headers: { apikey: SUPABASE_ANON } })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) {
      var p = rows && rows[0];
      if (!p) return renderNotFound(raw);
      renderProfile(p);
    })
    .catch(function () { renderNotFound(raw); });

  function renderNotFound(handle) {
    whoEl.textContent = "No one here yet";
    whatEl.textContent = "@" + handle + " is not a Noxe handle. Maybe it is waiting for you.";
    storeBtn.classList.remove("alt");
  }

  function initials(name, handle) {
    var s = (name || handle || "?").trim();
    return s ? s[0].toUpperCase() : "?";
  }
  function hex2rgb(h) { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join(""); var n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function lighten(hex, amt) { var c = hex2rgb(hex).map(function (v) { return Math.round(v + (255 - v) * amt); }); return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }

  // Mirrors the app's DefaultAvatar: a dark circle with a neon-gradient outline glyph, tinted to the
  // profile's own accent color. Used whenever there is no photo, or the photo URL fails to load.
  function defaultAvatarSvg(color) {
    var light = lighten(color, 0.4);
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">'
      + '<defs><linearGradient id="g" x1="25" y1="22" x2="75" y2="92" gradientUnits="userSpaceOnUse">'
      + '<stop offset="0" stop-color="' + light + '"/><stop offset="1" stop-color="' + color + '"/></linearGradient></defs>'
      + '<circle cx="50" cy="50" r="50" fill="#0c0a18"/>'
      + '<g fill="none" stroke="url(#g)" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round">'
      + '<circle cx="50" cy="37" r="14"/><path d="M22 92 C 22 68 35 62 50 62 C 65 62 78 68 78 92"/></g></svg>';
  }

  function fillAvatar(container, av, name, handle, accent) {
    container.innerHTML = "";
    var color = accent || "#A05BFF";
    var uri = av && av.uri;
    if (uri && /^https?:/i.test(uri)) {
      var img = document.createElement("img");
      img.alt = "";
      img.onerror = function () { container.innerHTML = defaultAvatarSvg(color); };
      img.src = uri;
      container.appendChild(img);
    } else {
      container.innerHTML = defaultAvatarSvg(color);
    }
  }

  function renderProfile(p) {
    var handle = p.handle || raw;
    var scheme = "noxe://u/" + encodeURIComponent(handle);

    if (p.priv) {
      document.getElementById("avatar").classList.remove("hidden");
      fillAvatar(document.getElementById("avatar"), p.avatar, p.name, handle, p.accent);
      whoEl.textContent = p.name || ("@" + handle);
      var hl = document.getElementById("handleLine");
      hl.classList.remove("hidden");
      hl.textContent = "@" + handle;
      whatEl.textContent = p.bio || "";
      document.getElementById("privnote").classList.remove("hidden");
      showOpen(scheme);
      return;
    }

    card.classList.add("hidden");
    var full = document.getElementById("profileFull");
    full.classList.remove("hidden");
    fillAvatar(document.getElementById("pfAvatar"), p.avatar, p.name, handle, p.accent);
    document.getElementById("pfName").textContent = p.name || ("@" + handle);
    document.getElementById("pfHandle").textContent = "@" + handle;
    document.getElementById("pfBio").textContent = p.bio || "";
    document.getElementById("pfOpen").href = scheme;
    document.getElementById("pfStore").href = STORE_URL;

    var lib = Array.isArray(p.lib) ? p.lib : [];
    var top3 = Array.isArray(p.top3) ? p.top3.slice(0, 3) : [];
    var ratings = p.ratings || {};
    var cats = Array.isArray(p.cats) ? p.cats : [];

    // Collections render as chips (name + count only) straight from the profile row: no extra fetch needed.
    if (cats.length) {
      var chips = document.getElementById("chips");
      cats.forEach(function (c) {
        if (!c || !c.name) return;
        var n = Array.isArray(c.items) ? c.items.length : 0;
        var chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = c.name + " · " + n;
        chips.appendChild(chip);
      });
      if (chips.children.length) document.getElementById("catsWrap").classList.remove("hidden");
    }

    if (!lib.length && !top3.length) return;

    // Bounded ring: highest rated first (recency as the tiebreak), capped at RING_MAX. Never render the
    // whole library on a public, unauthenticated page.
    var ringIds = lib
      .map(function (id, i) { return { id: id, r: (ratings[id] != null ? ratings[id] : -1), i: i }; })
      .sort(function (a, b) { return (b.r - a.r) || (b.i - a.i); })
      .slice(0, RING_MAX)
      .map(function (x) { return x.id; });

    var needIds = [];
    ringIds.concat(top3).forEach(function (id) { if (needIds.indexOf(id) === -1) needIds.push(id); });
    if (!needIds.length) return;

    var mcQs = "select=id,type,poster,ml&id=in.(" + needIds.map(function (id) { return encodeURIComponent(id); }).join(",") + ")";
    fetch(SUPABASE_URL + "/rest/v1/media_cache?" + mcQs, { headers: { apikey: SUPABASE_ANON } })
      .then(function (r) { return r.ok ? r.json() : []; })
      .then(function (rows) {
        var byId = {};
        (rows || []).forEach(function (row) { byId[row.id] = row; });
        renderTop3(top3, byId);
        renderOrbit(ringIds, byId);
      })
      .catch(function () {});
  }

  // Per igdb-twitch-coverart-licensing: game cover art is never rendered on the public web page (no signed
  // commercial IGDB agreement yet). Games always show a flat type-colour tile with the title instead. Every
  // other broken/missing image degrades to the same flat tile. No type emoji is ever placed near artwork.
  function tileNode(id, row, w, h) {
    var ml = (row && row.ml) || {};
    var type = row ? row.type : null;
    var title = ml.title || id;
    var color = TYPE_COLOR[type] || "#A05BFF";
    var el = document.createElement("div");
    el.className = "cover";
    el.style.width = w + "px";
    el.style.height = h + "px";
    el.title = title;
    var showArt = !!(row && row.poster && type !== "game");
    if (showArt) {
      var img = document.createElement("img");
      img.loading = "lazy";
      img.alt = "";
      img.onerror = function () { img.remove(); flatTile(el, color, title); };
      img.src = row.poster;
      el.appendChild(img);
    } else {
      flatTile(el, color, title);
    }
    return el;
  }
  function flatTile(el, color, title) {
    el.style.background = color + "26";
    el.style.borderColor = color + "55";
    var t = document.createElement("span");
    t.className = "cover-title";
    t.textContent = title;
    el.appendChild(t);
  }

  function renderTop3(ids, byId) {
    var wrap = document.getElementById("top3");
    var have = ids.filter(function (id) { return byId[id]; });
    if (!have.length) return;
    have.forEach(function (id) { wrap.appendChild(tileNode(id, byId[id], 92, 134)); });
    document.getElementById("top3Wrap").classList.remove("hidden");
  }

  function renderOrbit(ids, byId) {
    var have = ids.filter(function (id) { return byId[id]; });
    if (!have.length) return;
    var ring = document.getElementById("orbit");
    var n = have.length;
    var rx = 42, ry = 38; // ellipse radii, percent of the ring box
    have.forEach(function (id, i) {
      var angle = (2 * Math.PI * i) / n;
      var x = 50 + rx * Math.cos(angle);
      var y = 50 + ry * Math.sin(angle);
      var item = document.createElement("div");
      item.className = "orbit-item";
      item.style.left = x + "%";
      item.style.top = y + "%";
      item.appendChild(tileNode(id, byId[id], 44, 64));
      ring.appendChild(item);
    });
    document.getElementById("orbitWrap").classList.remove("hidden");
  }
})();
</script>
</body>
</html>
